server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/auth/**,/users/**
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/projects/**,/api/categories/**,/projects/**,/categories/**
        - id: bid-service
          uri: lb://bid-service
          predicates:
            - Path=/api/bids/**,/bids/**
        - id: contract-service
          uri: lb://contract-service
          predicates:
            - Path=/api/contracts/**,/api/milestones/**,/api/payments/**,/contracts/**,/milestones/**,/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: this-is-a-fresher-project-jwt-secret-key-change-me-32chars+