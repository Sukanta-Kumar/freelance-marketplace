server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**,/users/**
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/projects/**,/categories/**
        - id: bid-service
          uri: lb://bid-service
          predicates:
            - Path=/bids/**
        - id: contract-service
          uri: lb://contract-service
          predicates:
            - Path=/contracts/**,/milestones/**,/escrows/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true