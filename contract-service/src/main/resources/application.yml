server:
  port: 8084

spring:
  application:
    name: contract-service
  datasource:
    url: jdbc:mysql://localhost:3306/contract_db?useSSL=false&serverTimezone=UTC
    username: root
    password: Swayam@73
    driver-class-name: com.mysql.cj.jdbc.Driver
